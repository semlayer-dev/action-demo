name: sql
on: pull_request

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: semlayer-dev/semlayer@v0.7.0-beta.8
        with:
          mode: lint
          layer: layer.yaml
          files: "sql/**/*.sql"
          version: "0.7.0b8"
